name: maid_rent
description: "A maid rental app connecting domestic workers with households."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # Authentication
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1

  # Utils
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
